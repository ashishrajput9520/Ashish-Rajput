<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Beauty Salon - Admin Dashboard</title>
  <link rel="stylesheet" href="../salon.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #ec7fb1;
      --primary-light: rgba(236, 127, 177, 0.1);
      --secondary: #8f9cf4;
      --bg: #0a0a0f;
      --card-bg: #16161b;
      --text: #e0e0e0;
      --text-muted: #9aa0a6;
      --border: rgba(255, 255, 255, 0.1);
      --success: #3ac17e;
      --warning: #ffc107;
      --danger: #f44336;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Admin Layout */
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .admin-sidebar {
      width: 250px;
      background: #121218;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .admin-logo {
      display: flex;
      align-items: center;
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .admin-logo img {
      margin-right: 10px;
    }

    .admin-logo span {
      font-weight: 600;
      font-size: 16px;
    }

    .admin-nav {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
    }

    .admin-nav a {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      margin: 4px 10px;
      transition: all 0.2s ease;
      position: relative;
    }

    .admin-nav a i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    .admin-nav a:hover,
    .admin-nav a.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .admin-nav .badge {
      margin-left: auto;
      background: var(--warning);
      color: #000;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .admin-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    /* Main Content */
    .admin-main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 30px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .admin-title {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-logout {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(244, 67, 54, 0.1);
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }
    .admin-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }
    .btn-logout {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease;
    }
    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .inquiries-list {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .inquiry-item {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease;
    }
    .inquiry-item:last-child {
      border-bottom: none;
    }
    .inquiry-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .inquiry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .inquiry-name {
      font-weight: 600;
      font-size: 18px;
      color: white;
      margin: 0;
    }
    .inquiry-email {
      color: #a0a0a0;
      font-size: 14px;
      margin: 4px 0;
    }
    .inquiry-phone {
      color: #a0a0a0;
      font-size: 14px;
      margin: 4px 0 10px;
    }
    .inquiry-service {
      display: inline-block;
      background: rgba(143, 156, 244, 0.2);
      color: #8f9cf4;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .inquiry-message {
      color: #d0d0d0;
      line-height: 1.5;
      margin: 10px 0;
      white-space: pre-line;
    }
    .inquiry-date {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
    .inquiry-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-edit, .btn-delete {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-edit {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }
    .btn-edit:hover {
      background: rgba(76, 175, 80, 0.3);
    }
    .btn-delete {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }
    .btn-delete:hover {
      background: rgba(244, 67, 54, 0.3);
    }
    .no-inquiries {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pending {
      background: rgba(255, 193, 7, 0.2);
      color: #ffc107;
    }
    .status-completed {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }
    .inquiry-details {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }
    .detail-row {
      display: flex;
      margin-bottom: 8px;
    }
    .detail-label {
      width: 120px;
      color: #a0a0a0;
      font-size: 13px;
    }
    .detail-value {
      flex: 1;
      color: #e0e0e0;
      font-size: 14px;
    }
    .edit-form {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 3px solid #ff9800;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #a0a0a0;
    }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: white;
      font-family: inherit;
      font-size: 14px;
    }
    textarea.form-control {
      min-height: 80px;
      resize: vertical;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-cancel, .btn-save {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }
    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-save {
      background: var(--primary);
      color: white;
    }
    .btn-save:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <div class="admin-sidebar">
      <div class="admin-logo">
        <img src="../img/vr logo salon 2.png" alt="VR Beauty Salon" style="height: 40px;">
        <span>Admin Panel</span>
      </div>
      <nav class="admin-nav">
        <a href="#dashboard" class="active" data-section="dashboard">
          <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
        <a href="#inquiries" data-section="inquiries">
          <i class="fas fa-inbox"></i> Inquiries
          <span class="badge" id="pendingCount">0</span>
        </a>
        <a href="#staff" data-section="staff">
          <i class="fas fa-users"></i> Staff
        </a>
        <a href="#profile" data-section="profile">
          <i class="fas fa-user"></i> Profile
        </a>
      </nav>
      <div class="admin-footer">
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
      <div class="admin-header">
        <h1 class="admin-title">Inquiries</h1>
        <div class="admin-actions">
          <button id="refreshBtn" class="btn-icon" title="Refresh">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </div>

    <div id="inquiriesList" class="inquiries-list">
      <!-- Inquiries will be loaded here -->
      <div class="no-inquiries">Loading inquiries...</div>
    </div>
  </div>

  <script>
    // Check if user is logged in
    if (!localStorage.getItem('isLoggedIn')) {
      window.location.href = 'login.html';
    }

    // Sample staff data - in a real app, this would come from a backend
    let staffMembers = JSON.parse(localStorage.getItem('staff')) || [
      { id: 1, name: 'Priya Sharma', role: 'Senior Stylist', email: 'priya@example.com', phone: '+91 9876543210', status: 'active' },
      { id: 2, name: 'Rahul Verma', role: 'Color Specialist', email: 'rahul@example.com', phone: '+91 9876543211', status: 'active' },
      { id: 3, name: 'Anjali Patel', role: 'Spa Therapist', email: 'anjali@example.com', phone: '+91 9876543212', status: 'on leave' }
    ];

    // Save staff to localStorage
    function saveStaff() {
      localStorage.setItem('staff', JSON.stringify(staffMembers));
    }

    // In a real application, you would fetch this from your backend
    let inquiries = JSON.parse(localStorage.getItem('inquiries')) || [];
    
    // DOM Elements
    const mainContent = document.querySelector('.admin-main');
    const navLinks = document.querySelectorAll('.admin-nav a');
    const logoutBtn = document.getElementById('logoutBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    // Logout functionality
    logoutBtn.addEventListener('click', function() {
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'login.html';
    });

    // Refresh button
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function() {
        location.reload();
      });
    }

    // Navigation
    navLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const section = this.getAttribute('data-section');
        
        // Update active state
        navLinks.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
        
        // Load the appropriate section
        loadSection(section);
      });
    });

    // Load section based on URL hash or default to dashboard
    function loadInitialSection() {
      const hash = window.location.hash.substring(1) || 'dashboard';
      const section = document.querySelector(`[data-section="${hash}"]`);
      
      if (section) {
        navLinks.forEach(l => l.classList.remove('active'));
        section.classList.add('active');
        loadSection(hash);
      }
    }

    // Load different sections
    function loadSection(section) {
      switch(section) {
        case 'dashboard':
          loadDashboard();
          break;
        case 'inquiries':
          loadInquiries();
          break;
        case 'staff':
          loadStaff();
          break;
        case 'profile':
          loadProfile();
          break;
        default:
          loadDashboard();
      }
    }

    // Load Dashboard
    function loadDashboard() {
      const pendingCount = inquiries.filter(i => i.status === 'pending').length;
      const staffCount = staffMembers.length;
      const activeStaff = staffMembers.filter(s => s.status === 'active').length;
      
      mainContent.innerHTML = `
        <div class="admin-header">
          <h1 class="admin-title">Dashboard</h1>
          <div class="admin-actions">
            <button id="refreshBtn" class="btn-icon" title="Refresh">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
        </div>
        
        <div class="dashboard-stats">
          <div class="stat-card">
            <div class="stat-value">${inquiries.length}</div>
            <div class="stat-label">Total Inquiries</div>
            <div class="stat-icon"><i class="fas fa-inbox"></i></div>
          </div>
          
          <div class="stat-card">
            <div class="stat-value">${pendingCount}</div>
            <div class="stat-label">Pending</div>
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
          </div>
          
          <div class="stat-card">
            <div class="stat-value">${staffCount}</div>
            <div class="stat-label">Staff Members</div>
            <div class="stat-icon"><i class="fas fa-users"></i></div>
          </div>
          
          <div class="stat-card">
            <div class="stat-value">${activeStaff}/${staffCount}</div>
            <div class="stat-label">Active Staff</div>
            <div class="stat-icon"><i class="fas fa-user-check"></i></div>
          </div>
        </div>
        
        <div class="recent-activity">
          <h2>Recent Activity</h2>
          <div class="activity-list">
            ${getRecentActivity()}
          </div>
        </div>
      `;
      
      // Add event listener for the refresh button in the dashboard
      document.getElementById('refreshBtn')?.addEventListener('click', () => location.reload());
    }

    // Load Staff Management
    function loadStaff() {
      mainContent.innerHTML = `
        <div class="admin-header">
          <h1 class="admin-title">Staff Management</h1>
          <div class="admin-actions">
            <button id="addStaffBtn" class="btn-primary">
              <i class="fas fa-plus"></i> Add Staff
            </button>
            <button id="refreshBtn" class="btn-icon" title="Refresh">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
        </div>
        
        <div class="staff-list">
          ${renderStaffList()}
        </div>
      `;
      
      // Add event listeners
      document.getElementById('addStaffBtn')?.addEventListener('click', showAddStaffForm);
      document.getElementById('refreshBtn')?.addEventListener('click', () => loadStaff());
      
      // Add event delegation for edit/delete buttons
      document.querySelectorAll('.edit-staff').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const staffId = parseInt(e.target.closest('tr').dataset.id);
          editStaff(staffId);
        });
      });
      
      document.querySelectorAll('.delete-staff').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const staffId = parseInt(e.target.closest('tr').dataset.id);
          deleteStaff(staffId);
        });
      });
    }

    // Render staff list
    function renderStaffList() {
      if (staffMembers.length === 0) {
        return '<div class="no-data">No staff members found. Click "Add Staff" to get started.</div>';
      }
      
      return `
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Contact</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${staffMembers.map(staff => `
              <tr data-id="${staff.id}">
                <td>
                  <div class="staff-avatar">${staff.name.charAt(0)}</div>
                  <div class="staff-info">
                    <div class="staff-name">${staff.name}</div>
                    <div class="staff-email">${staff.email}</div>
                  </div>
                </td>
                <td>${staff.role}</td>
                <td>${staff.phone}</td>
                <td><span class="status-badge ${staff.status === 'active' ? 'status-active' : 'status-inactive'}">
                  ${staff.status}
                </span></td>
                <td class="actions">
                  <button class="btn-icon edit-staff" title="Edit">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button class="btn-icon delete-staff" title="Delete">
                    <i class="fas fa-trash"></i>
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Show add staff form
    function showAddStaffForm() {
      mainContent.innerHTML = `
        <div class="admin-header">
          <h1 class="admin-title">Add New Staff Member</h1>
        </div>
        
        <div class="form-container">
          <form id="staffForm">
            <div class="form-group">
              <label for="staffName">Full Name</label>
              <input type="text" id="staffName" required>
            </div>
            
            <div class="form-group">
              <label for="staffRole">Role</label>
              <input type="text" id="staffRole" required>
            </div>
            
            <div class="form-group">
              <label for="staffEmail">Email</label>
              <input type="email" id="staffEmail" required>
            </div>
            
            <div class="form-group">
              <label for="staffPhone">Phone</label>
              <input type="tel" id="staffPhone" required>
            </div>
            
            <div class="form-group">
              <label for="staffStatus">Status</label>
              <select id="staffStatus" required>
                <option value="active">Active</option>
                <option value="on leave">On Leave</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            
            <div class="form-actions">
              <button type="button" class="btn-cancel" onclick="loadStaff()">Cancel</button>
              <button type="submit" class="btn-primary">Save Staff</button>
            </div>
          </form>
        </div>
      `;
      
      // Handle form submission
      document.getElementById('staffForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const newStaff = {
          id: Date.now(),
          name: document.getElementById('staffName').value,
          role: document.getElementById('staffRole').value,
          email: document.getElementById('staffEmail').value,
          phone: document.getElementById('staffPhone').value,
          status: document.getElementById('staffStatus').value
        };
        
        staffMembers.push(newStaff);
        saveStaff();
        loadStaff();
      });
    }

    // Edit staff member
    function editStaff(staffId) {
      const staff = staffMembers.find(s => s.id === staffId);
      if (!staff) return;
      
      mainContent.innerHTML = `
        <div class="admin-header">
          <h1 class="admin-title">Edit Staff Member</h1>
        </div>
        
        <div class="form-container">
          <form id="editStaffForm">
            <div class="form-group">
              <label for="editStaffName">Full Name</label>
              <input type="text" id="editStaffName" value="${staff.name}" required>
            </div>
            
            <div class="form-group">
              <label for="editStaffRole">Role</label>
              <input type="text" id="editStaffRole" value="${staff.role}" required>
            </div>
            
            <div class="form-group">
              <label for="editStaffEmail">Email</label>
              <input type="email" id="editStaffEmail" value="${staff.email}" required>
            </div>
            
            <div class="form-group">
              <label for="editStaffPhone">Phone</label>
              <input type="tel" id="editStaffPhone" value="${staff.phone}" required>
            </div>
            
            <div class="form-group">
              <label for="editStaffStatus">Status</label>
              <select id="editStaffStatus" required>
                <option value="active" ${staff.status === 'active' ? 'selected' : ''}>Active</option>
                <option value="on leave" ${staff.status === 'on leave' ? 'selected' : ''}>On Leave</option>
                <option value="inactive" ${staff.status === 'inactive' ? 'selected' : ''}>Inactive</option>
              </select>
            </div>
            
            <div class="form-actions">
              <button type="button" class="btn-cancel" onclick="loadStaff()">Cancel</button>
              <button type="submit" class="btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      `;
      
      // Handle form submission
      document.getElementById('editStaffForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const updatedStaff = {
          ...staff,
          name: document.getElementById('editStaffName').value,
          role: document.getElementById('editStaffRole').value,
          email: document.getElementById('editStaffEmail').value,
          phone: document.getElementById('editStaffPhone').value,
          status: document.getElementById('editStaffStatus').value
        };
        
        const index = staffMembers.findIndex(s => s.id === staffId);
        if (index !== -1) {
          staffMembers[index] = updatedStaff;
          saveStaff();
          loadStaff();
        }
      });
    }

    // Delete staff member
    function deleteStaff(staffId) {
      if (confirm('Are you sure you want to delete this staff member?')) {
        staffMembers = staffMembers.filter(s => s.id !== staffId);
        saveStaff();
        loadStaff();
      }
    }

    // Load Profile
    function loadProfile() {
      // In a real app, this would load the logged-in admin's profile
      mainContent.innerHTML = `
        <div class="admin-header">
          <h1 class="admin-title">My Profile</h1>
        </div>
        
        <div class="profile-container">
          <div class="profile-card">
            <div class="profile-header">
              <div class="profile-avatar">A</div>
              <div class="profile-info">
                <h2>Admin User</h2>
                <p>Administrator</p>
              </div>
            </div>
            
            <div class="profile-details">
              <div class="detail-item">
                <span class="detail-label">Email:</span>
                <span class="detail-value">admin@vrbeautysalon.com</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Last Login:</span>
                <span class="detail-value">${new Date().toLocaleString()}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Account Created:</span>
                <span class="detail-value">${new Date().toLocaleDateString()}</span>
              </div>
            </div>
            
            <div class="profile-actions">
              <button class="btn-primary">
                <i class="fas fa-edit"></i> Edit Profile
              </button>
              <button class="btn-secondary">
                <i class="fas fa-lock"></i> Change Password
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Get recent activity for dashboard
    function getRecentActivity() {
      if (inquiries.length === 0) {
        return '<div class="no-activity">No recent activity</div>';
      }
      
      const recent = [...inquiries]
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .slice(0, 5);
      
      return recent.map(inquiry => `
        <div class="activity-item">
          <div class="activity-icon">
            <i class="fas ${inquiry.status === 'completed' ? 'fa-check-circle' : 'fa-clock'}"></i>
          </div>
          <div class="activity-details">
            <div class="activity-title">New inquiry from ${inquiry.name}</div>
            <div class="activity-meta">
              <span>${new Date(inquiry.date).toLocaleString()}</span>
              <span class="status-badge ${inquiry.status === 'completed' ? 'status-completed' : 'status-pending'}">
                ${inquiry.status}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // Initialize the dashboard
    loadInitialSection();
    
    // Update pending count in sidebar
    function updatePendingCount() {
      const pendingCount = inquiries.filter(i => i.status === 'pending').length;
      const countElement = document.getElementById('pendingCount');
      if (countElement) {
        countElement.textContent = pendingCount;
        countElement.style.display = pendingCount > 0 ? 'flex' : 'none';
      }
    }
    
    // Initial update of pending count
    updatePendingCount();

    // Function to render inquiries
    function renderInquiries() {
      const container = document.getElementById('inquiriesList');
      
      if (inquiries.length === 0) {
        container.innerHTML = '<div class="no-inquiries">No inquiries found.</div>';
        return;
      }

      // Sort by date (newest first)
      const sortedInquiries = [...inquiries].sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = sortedInquiries.map((inquiry, index) => {
        const date = new Date(inquiry.date).toLocaleString();
        const statusClass = inquiry.status === 'completed' ? 'status-completed' : 'status-pending';
        
        return `
          <div class="inquiry-item" data-id="${index}">
            <div class="inquiry-header">
              <h3 class="inquiry-name">${inquiry.name}</h3>
              <span class="status-badge ${statusClass}">${inquiry.status || 'pending'}</span>
            </div>
            <div class="inquiry-email">${inquiry.email}</div>
            <div class="inquiry-phone">${inquiry.phone || 'No phone provided'}</div>
            ${inquiry.service ? `<div class="inquiry-service">${inquiry.service}</div>` : ''}
            
            <div class="inquiry-details">
              <div class="detail-row">
                <div class="detail-label">Date:</div>
                <div class="detail-value">${date}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Message:</div>
                <div class="detail-value">${inquiry.message || 'No message provided'}</div>
              </div>
            </div>

            <div class="inquiry-actions">
              <button class="btn-edit" onclick="editInquiry(${index})">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button class="btn-delete" onclick="deleteInquiry(${index})">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Function to delete an inquiry
    window.deleteInquiry = function(index) {
      if (confirm('Are you sure you want to delete this inquiry?')) {
        inquiries.splice(index, 1);
        localStorage.setItem('inquiries', JSON.stringify(inquiries));
        renderInquiries();
      }
    };

    // Function to edit an inquiry
    window.editInquiry = function(index) {
      const inquiry = inquiries[index];
      const inquiryItem = document.querySelector(`.inquiry-item[data-id="${index}"]`);
      
      inquiryItem.innerHTML = `
        <div class="edit-form">
          <h3>Edit Inquiry</h3>
          <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" id="editName" value="${inquiry.name}">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" id="editEmail" value="${inquiry.email}">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" class="form-control" id="editPhone" value="${inquiry.phone || ''}">
          </div>
          <div class="form-group">
            <label>Service</label>
            <input type="text" class="form-control" id="editService" value="${inquiry.service || ''}">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" id="editStatus">
              <option value="pending" ${inquiry.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="completed" ${inquiry.status === 'completed' ? 'selected' : ''}>Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea class="form-control" id="editMessage">${inquiry.message || ''}</textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" onclick="renderInquiries()">Cancel</button>
            <button type="button" class="btn-save" onclick="saveInquiry(${index})">Save Changes</button>
          </div>
        </div>
      `;
    };

    // Function to save edited inquiry
    window.saveInquiry = function(index) {
      const inquiry = inquiries[index];
      
      inquiry.name = document.getElementById('editName').value;
      inquiry.email = document.getElementById('editEmail').value;
      inquiry.phone = document.getElementById('editPhone').value;
      inquiry.service = document.getElementById('editService').value;
      inquiry.status = document.getElementById('editStatus').value;
      inquiry.message = document.getElementById('editMessage').value;
      inquiry.updatedAt = new Date().toISOString();
      
      localStorage.setItem('inquiries', JSON.stringify(inquiries));
      renderInquiries();
    };

    // Initial render
    renderInquiries();
  </script>
</body>
</html>
