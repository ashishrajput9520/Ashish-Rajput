<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Beauty Salon - Admin Login</title>
  <link rel="stylesheet" href="../salon.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background: rgba(17, 17, 22, 0.9);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .login-title {
      text-align: center;
      margin-bottom: 30px;
      color: var(--primary);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 16px;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn-login:hover {
      background: #d45d8f;
    }
    .error-message {
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="login-title" style="
      font-size: 2.8rem;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      background: linear-gradient(90deg, #ffda6b 30%, #ec7fb1 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    ">
      <span style="font-size:2.1rem;vertical-align:-2px;"></span>
      Admin Login
    </h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group" style="position: relative;">
        <label for="password">Password</label>
        <input type="password" id="password" required style="padding-right: 38px;">
        <button type="button" id="togglePassword" tabindex="-1" aria-label="Show/Hide Password" style="position:absolute;top:43px;right:15px;background:transparent;border:none;outline:none;cursor:pointer;padding:0;">
          <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/></svg>
        </button>
      </div>
      <button type="submit" class="btn-login">Login</button>
      <div id="errorMessage" class="error-message">Invalid username or password</div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      
      // In a real application, you would validate the credentials on the server
      // This is just a simple example for demonstration purposes
      if (username === 'admin' && password === 'admin123') {
        // Store login state in localStorage
        localStorage.setItem('isLoggedIn', 'true');
        // Redirect to admin dashboard
        window.location.href = 'dashboard.html';
      } else {
        errorMessage.style.display = 'block';
        setTimeout(() => {
          errorMessage.style.display = 'none';
        }, 3000);
      }
    });
  </script>
  <script>
    // Password show/hide toggle
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    let shown = false;
    togglePassword.addEventListener('click', function() {
      shown = !shown;
      passwordInput.type = shown ? 'text' : 'password';
      // Swap SVG icon
      eyeIcon.innerHTML = shown
        ? '<path d="M17.94 17.94A10.06 10.06 0 0 1 12 20c-6 0-10-8-10-8a18.2 18.2 0 0 1 3.07-3.87m3.11-2.44A9.94 9.94 0 0 1 12 4c6 0 10 8 10 8a18.1 18.1 0 0 1-4.06 5.94M1 1l22 22" stroke="#ccc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>';
    });
  </script>
</body>
</html>
